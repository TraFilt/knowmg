<title>رحلة الموشن مع Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a game map — five stages down a winding path of round section nodes; each node opens a lesson screen (why → clip → explanation → apply in Claude). */
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --sunk:#F3ECE2; --ink:#1E2328; --soft:#5A6068; --line:#E7DED1;
  --teal:#1F5F61; --teal-ink:#FFFFFF; --teal-soft:#DDECEA; --accent:#C8623F; --accent-soft:#F6E3D9;
  --gold:#E8B04B; --gold-ink:#3A2A08; --ok:#2E7D4F; --ok-soft:#DFF1E5; --bad:#B3402A; --bad-soft:#F8E1DB;
  --lock:#B9B0A4;
  --f-ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --base:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1B; --surface:#1C2425; --sunk:#232C2D; --ink:#EEF1EF; --soft:#A9B4B2; --line:#2F3A3B;
  --teal:#3F9C97; --teal-ink:#0E1516; --teal-soft:#1F3433; --accent:#E8845F; --accent-soft:#3A2820;
  --gold:#F0BE5E; --gold-ink:#2A1E05; --ok:#5FC08A; --ok-soft:#173427; --bad:#F08A72; --bad-soft:#3A221C; --lock:#55605F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1B; --surface:#1C2425; --sunk:#232C2D; --ink:#EEF1EF; --soft:#A9B4B2; --line:#2F3A3B;
  --teal:#3F9C97; --teal-ink:#0E1516; --teal-soft:#1F3433; --accent:#E8845F; --accent-soft:#3A2820;
  --gold:#F0BE5E; --gold-ink:#2A1E05; --ok:#5FC08A; --ok-soft:#173427; --bad:#F08A72; --bad-soft:#3A221C; --lock:#55605F; color-scheme:dark}
:root.size-l{--base:22px} :root.size-xl{--base:25px}
*{box-sizing:border-box}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.75;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin-inline:auto}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
.en{font-family:var(--f-ui);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:var(--teal)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:.55rem max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.who{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;align-items:center;gap:.3rem;background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:99px;padding:.15rem .75rem;font-variant-numeric:tabular-nums}
.sizes{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sizes button{background:var(--surface);border:0;padding:.2rem .65rem;font-weight:700;min-width:2.4rem}
.sizes button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.prog{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px;transition:width .6s ease}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:16px;padding:.75rem 1.4rem;font-weight:700;font-size:1.05rem;background:var(--teal);color:var(--teal-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ===== activation ===== */
.hero{padding-block:2.2rem 1rem;display:grid;gap:1rem}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.02em}
.hero h1{font-size:2.2rem}
.hero h1 b{color:var(--teal)}
.hero p{color:var(--soft);font-size:1.08rem;max-width:34em}
.preview{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.preview span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.2rem .9rem;font-weight:600;font-size:.9rem}
.preview span b{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.4rem}
.act{display:grid;gap:1rem;margin-top:1rem}
.act h2{font-size:1.4rem}
.field{display:grid;gap:.3rem}
.field label{font-weight:700}
.field input{font:inherit;font-size:1.1rem;padding:.7rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:100%}
.field input.code{direction:ltr;text-align:center;letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.msg{border-radius:12px;padding:.6rem 1rem;font-weight:600}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.demo{background:var(--accent-soft);border-radius:14px;padding:.7rem 1rem;font-size:.92rem}
.demo b{direction:ltr;unicode-bidi:isolate}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1.2rem}
.how div{background:var(--sunk);border-radius:16px;padding:.9rem;font-size:.92rem}
.how b{display:block;font-size:1rem}
@media (max-width:560px){.how{grid-template-columns:1fr}.hero h1{font-size:1.75rem}}

/* ===== map ===== */
.hello{padding-block:1.4rem .6rem;display:grid;gap:.3rem}
.hello h1{font-size:1.6rem}
.hello p{color:var(--soft)}
.stage{margin-top:1.6rem;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stage-head{display:flex;gap:1rem;align-items:center;padding:1rem 1.2rem;background:var(--teal);color:var(--teal-ink)}
.stage.locked .stage-head{background:var(--sunk);color:var(--soft)}
.stage-head .lvl{flex:0 0 auto;width:3.1rem;height:3.1rem;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--teal-ink) 16%,transparent);font-weight:700;font-size:1.3rem}
.stage-head h2{font-size:1.25rem}
.stage-head p{font-size:.9rem;opacity:.9}
.stage-head .badge{margin-inline-start:auto;flex:0 0 auto;font-size:.85rem;font-weight:700;border-radius:99px;padding:.15rem .8rem;background:var(--gold);color:var(--gold-ink)}
.stage-head .badge.dim{background:color-mix(in srgb,var(--teal-ink) 18%,transparent);color:inherit}
.path{position:relative;padding:1.4rem 1rem 1.6rem;display:grid;gap:1.1rem}
.path::before{content:"";position:absolute;top:2rem;bottom:2rem;right:50%;border-right:4px dotted var(--line)}
.node{position:relative;display:flex;align-items:center;gap:1rem;width:min(100%,24rem);background:transparent;border:0;padding:0;text-align:right}
.node:nth-child(odd){margin-inline-start:0;margin-inline-end:auto;flex-direction:row}
.node:nth-child(even){margin-inline-start:auto;flex-direction:row-reverse;text-align:left}
.node .dot{flex:0 0 auto;width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);font-weight:700;font-size:1.3rem;position:relative;z-index:1}
.node.done .dot{background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.node.locked .dot{background:var(--lock);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--lock) 70%,#000)}
.node.current .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .lbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.45rem .9rem;min-width:0}
.node .lbl b{display:block;font-size:.98rem;line-height:1.45}
.node .lbl small{color:var(--soft);font-size:.82rem}
.node.locked{cursor:not-allowed}
.node.locked .lbl{opacity:.6}
.node svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.path::before{right:2.2rem}.node,.node:nth-child(even){margin:0;flex-direction:row;text-align:right;width:100%}}

/* ===== lesson ===== */
.lesson{padding-block:1.2rem 2rem;display:grid;gap:1.2rem}
.back{justify-self:start}
.crumb{color:var(--accent);font-weight:700}
.lesson h1{font-size:1.75rem}
.steps-row{display:flex;gap:.4rem}
.steps-row i{flex:1;height:8px;border-radius:99px;background:var(--sunk)}
.steps-row i.on{background:var(--teal)}
.points{display:grid;gap:.8rem;padding:0;margin:0;list-style:none}
.points li{display:flex;gap:.9rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem 1.1rem}
.points li .n{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700}
.points li p{min-width:0}
.clip{border-radius:20px;overflow:hidden;background:var(--teal);color:var(--teal-ink);aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;position:relative}
.clip video{width:100%;height:100%;display:block;background:#0E1516}
.clip .ph{display:grid;gap:.5rem;justify-items:center;padding:1rem}
.clip .ph .play{width:4.2rem;height:4.2rem;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.clip .ph .play svg{width:1.7rem;height:1.7rem;fill:var(--gold-ink)}
.clip .ph small{opacity:.85;font-size:.85rem}
.cliptag{font-size:.85rem;color:var(--soft);margin-top:-.6rem}
.copybox{background:var(--surface);border:2px dashed var(--accent);border-radius:18px;padding:1rem 1.1rem;display:grid;gap:.7rem}
.copybox .t{font-weight:700;color:var(--accent)}
.copybox .txt{font-weight:500;line-height:1.9;min-width:0;overflow-wrap:anywhere}
.copybox .txt.ltr{direction:ltr;text-align:left;font-weight:700}
.copybox .btn{justify-self:start;padding:.45rem 1rem;font-size:.95rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;min-width:420px}
.tbl th{background:var(--teal);color:var(--teal-ink);text-align:right;padding:.6rem .9rem;font-size:.95rem}
.tbl td{border-top:1px solid var(--line);padding:.6rem .9rem;font-size:.95rem;vertical-align:top}
.tbl td.say{color:var(--accent);font-weight:600}
.k{display:inline-block;border:1.5px solid var(--ink);border-radius:8px;padding:0 .45rem;font-weight:700;font-size:.9em;direction:ltr;unicode-bidi:isolate;background:var(--surface)}
.pathtxt{display:inline-block;background:var(--teal-soft);color:var(--teal);font-weight:700;border-radius:8px;padding:0 .45rem;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tools div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;min-width:0}
.tools b{display:block}
.tools small{color:var(--soft);font-size:.85rem;line-height:1.6;display:block}
.tools .tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:0 .55rem;margin-top:.3rem}
.tools .tag.link{background:var(--accent-soft);color:var(--accent)} .tools .tag.free{background:var(--teal-soft);color:var(--teal)}
@media (max-width:560px){.tools{grid-template-columns:1fr}}

.why{background:var(--accent-soft);border-radius:18px;padding:.9rem 1.2rem;display:grid;gap:.2rem}
.why b{color:var(--accent)}
.explain{display:grid;gap:.9rem}
.explain h2{font-size:1.3rem}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem 1.2rem;display:grid;gap:.35rem}
.ex h3{font-size:1.08rem;color:var(--teal)}
.ex p{line-height:1.95}
.apply{background:var(--teal-soft);border:2px solid var(--teal);border-radius:24px;padding:1.2rem;display:grid;gap:.9rem}
.apply-head{display:flex;align-items:center;gap:.7rem}
.apply-ic{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:0 0 auto}
.apply-ic svg{width:1.1rem;height:1.1rem;fill:var(--teal-ink)}
.apply h2{font-size:1.35rem;color:var(--teal)}
.apply-sub{color:var(--soft);margin-top:-.4rem}
.apply-h3{font-size:1.1rem;color:var(--teal);margin-top:.3rem}
.apply-steps{display:grid;gap:.6rem;padding:0;margin:0;list-style:none}
.apply-steps li{display:flex;gap:.8rem;align-items:flex-start;background:var(--surface);border-radius:16px;padding:.8rem 1rem}
.apply-steps .n{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.apply-steps p{min-width:0;font-weight:500}
.links{display:grid;gap:.6rem}
.linkcard{display:grid;gap:.1rem;text-decoration:none;background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:.8rem 1rem;color:var(--ink);box-shadow:0 3px 0 color-mix(in srgb,var(--teal) 50%,transparent)}
.linkcard:hover{background:var(--bg)}
.lk-t{font-weight:700;color:var(--teal);font-size:1.05rem}
.lk-u{direction:ltr;text-align:left;font-size:.85rem;color:var(--soft);overflow-wrap:anywhere}
.lk-n{font-size:.88rem;color:var(--soft)}
.success{background:var(--ok-soft);border-radius:16px;padding:.8rem 1rem;color:var(--ok)}
.success p{color:var(--ink)}
.btn.big{width:100%;padding:1rem;font-size:1.15rem}
.donebadge{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--gold);color:var(--gold-ink);border-radius:16px;padding:.8rem;font-weight:700}
.next-row{display:flex;gap:.8rem;flex-wrap:wrap}

/* celebration + certificate */
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);border-radius:16px;padding:.7rem 1.2rem;font-weight:700;transition:transform .35s ease;z-index:20;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.cert{background:var(--surface);border:3px solid var(--gold);border-radius:26px;padding:2rem 1.5rem;text-align:center;display:grid;gap:.7rem;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1.5px dashed var(--gold);border-radius:18px;pointer-events:none}
.cert .medal{width:5rem;height:5rem;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;margin-inline:auto;font-size:2rem;font-weight:700}
.cert h2{font-size:1.2rem;color:var(--soft);font-weight:600}
.cert .nm{font-size:2rem;font-weight:700;color:var(--teal)}
.cert p{color:var(--soft)}
.foot{margin-top:2.4rem;text-align:center;color:var(--soft);font-size:.85rem;display:grid;gap:.5rem;justify-items:center}
.linkbtn{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ COURSE CONTENT ============
   Each section:
   why      : one sentence, why this matters
   explain  : [{h, p}]  deeper explanation blocks (p may hold several sentences)
   links    : [{label, url, note}]  buttons that open a page
   prompts  : [{t, txt, ltr}]  text to copy into Claude
   apply    : {steps:[...], success:"..."}  what to do in Claude now, and how you know it worked
*/
const P = s => `<span class="pathtxt">${s}</span>`;
const K = s => `<span class="k">${s}</span>`;
const STAGES = [
 {id:1, title:"افهم الفكرة", sub:"ما الذي سنصنعه، ومن سيساعدنا", sections:[
  {id:"1-1", title:"ما هو Claude وكيف يصنع فيديو؟", min:"8 دقائق", clip:"clips/1-1.mp4", voiced:true,
   why:"إذا فهمت كيف يعمل Claude، ستعرف ماذا تطلب منه وكيف تصحّح له، بدل أن تجرّب عشوائياً.",
   explain:[
    {h:"مساعد تكلّمه، لا برنامج تتعلّمه", p:"البرامج المعتادة لصناعة الفيديو فيها مئات الأزرار والقوائم، وتحتاج شهوراً لتتقنها. Claude مختلف: أنت لا تضغط أزراراً، بل تكتب له ما تريد بكلامك العادي، كما تشرح لمصمّم يجلس بجانبك. يفهم اللهجة، ويسأل إذا احتاج توضيحاً، ويقترح عليك إذا كنت محتاراً."},
    {h:"لماذا تطبيق الكمبيوتر بالذات؟", p:"في المتصفح أو الجوال يستطيع Claude أن يكتب ويشرح فقط. أما في تطبيق الكمبيوتر فيصبح عنده «يدان»: يستطيع أن ينشئ ملفات في مجلدك، ويشغّل البرامج التي تصنع الحركة، ويحمّل الصور بعد إذنك، ثم يصدّر الفيديو النهائي. لهذا كل عملنا في هذه الدورة من تطبيق الكمبيوتر."},
    {h:"ماذا يحدث خلف الكواليس؟", p:"عندما تكتب فكرتك، يمرّ Claude بخطوات ثابتة: يكتب خطة المشاهد (ماذا يظهر في كل ثانية)، ثم يصمّم كل مشهد ويحرّكه بالكود، ثم يضيف الصوت من ElevenLabs والموسيقى، ثم يراجع لقطات من الفيديو بعينه قبل أن يسلّمه لك. أنت ترى النتيجة فقط، ولا تحتاج أن تفهم الكود."},
    {h:"ما دورك أنت؟", p:"دورك هو دور صاحب الفكرة والمخرج النهائي: تحدّد الموضوع والجمهور، وتختار بين الخيارات التي يعرضها عليك، وتشاهد النتيجة وتقول رأيك بصراحة. كلما كانت ملاحظاتك واضحة («الخط صغير»، «المشهد الثالث سريع»)، كانت النتيجة أقرب لما في بالك."}],
   prompts:[{t:"أول رسالة: تعرّف على Claude", txt:"مرحباً، أنا جديد ولا أعرف شيئاً عن التقنية. اشرح لي ببساطة وبأمثلة ماذا تستطيع أن تفعل لي في صناعة فيديو قصير عن موضوع أختاره."}],
   links:[{label:"افتح Claude", url:"https://claude.ai", note:"إن لم يكن التطبيق مثبّتاً بعد، جرّب هذه الرسالة من المتصفح"}],
   apply:{steps:["افتح Claude (من التطبيق أو المتصفح).","انسخ الرسالة بالأعلى والصقها في مربع الكتابة واضغط إرسال.","اقرأ الرد، واسأله أي سؤال خطر في بالك، مثلاً: «كم يأخذ وقت؟»."], success:"وصلك رد يشرح لك بلغة بسيطة كيف سيساعدك."}},
  {id:"1-2", title:"فريق الأدوات، ولماذا نربطها", min:"8 دقائق", clip:"clips/1-2.mp4", voiced:true,
   why:"ستسمع أسماء هذه الأدوات طوال الدورة. عندما تعرف دور كل واحدة، لن تقلق إذا ذكرها Claude أمامك.",
   explain:[
    {h:"تخيّل استوديو إنتاج صغيراً", p:"في أي استوديو حقيقي يوجد مخرج، ومعلّق صوتي، ومصمّم حركة، ومكتبة صور. Claude هو المخرج الذي يدير الجميع، وكل أداة من الأدوات التالية تقوم بدور واحد محدّد. أنت تتعامل مع المخرج فقط، وهو يوزّع العمل."},
    {h:"أدوات تحتاج إذنك (ربط)", p:"بعض الأدوات تعمل باسمك وتستهلك من رصيد حسابك، مثل ElevenLabs الذي يصنع الصوت. لهذا يجب أن «تربطها» مرة واحدة: تسجّل دخولك وتعطي Claude الإذن. هذا مثل أن توكّل شخصاً ليستخدم حسابك في مهمة معيّنة، وتستطيع إلغاء الإذن في أي وقت."},
    {h:"أدوات مجانية بدون ربط", p:"أدوات أخرى مثل Remotion (يصنع الحركة) و whatships (معرض أساليب) و 21st.dev (قطع تصميم جاهزة) ومكتبات الصور المجانية، لا تحتاج حساباً منك. Claude يثبّتها أو يزورها بنفسه عند الحاجة. لا تحتاج أن تفعل أي شيء معها."},
    {h:"هل أحتاج أن أدفع لكل هذه الأدوات؟", p:"تحتاج حساب Claude، وحساب ElevenLabs إذا أردت صوتاً معلّقاً (فيه خطة مجانية برصيد محدود). باقي الأدوات مجانية. يمكنك أيضاً صناعة فيديو بدون صوت معلّق (نصوص وموسيقى فقط) إذا أردت البدء بدون ElevenLabs."}],
   tools:true,
   links:[{label:"أنشئ حساب ElevenLabs", url:"https://elevenlabs.io", note:"ستحتاجه في المرحلة 3، أنشئه الآن إن لم يكن عندك"}],
   prompts:[{t:"اسأل Claude عن الفريق", txt:"اشرح لي ببساطة ما دور كل من: ElevenLabs و Remotion في صناعة فيديو موشن جرافيك، ولماذا يحتاج ElevenLabs أن أربطه بحسابي."}],
   apply:{steps:["أنشئ حساباً في ElevenLabs من الزر بالأعلى (إن لم يكن عندك).","أرسل لـ Claude الرسالة الجاهزة واقرأ شرحه."], success:"عندك حساب ElevenLabs، وفهمت الفرق بين أداة تحتاج ربطاً وأداة لا تحتاج."}}
 ]},
 {id:2, title:"جهّز جهازك", sub:"أربع خطوات تفعلها مرة واحدة فقط", sections:[
  {id:"2-1", title:"ثبّت تطبيق Claude", min:"5 دقائق", clip:"clips/2-1.mp4",
   why:"تطبيق الكمبيوتر هو المكان الوحيد الذي يستطيع فيه Claude أن يصنع ملف فيديو ويحفظه عندك.",
   explain:[
    {h:"ما الفرق بين التطبيق والموقع؟", p:"الموقع claude.ai يعمل داخل المتصفح، وهو ممتاز للأسئلة والكتابة. التطبيق يُثبّت على جهازك مثل أي برنامج، ويسمح لـ Claude أن يعمل على ملفاتك ومجلداتك. نفس الحساب يعمل في الاثنين، فلا تحتاج حساباً جديداً."},
    {h:"ويندوز أو ماك؟", p:"صفحة التحميل تعرف نوع جهازك تلقائياً وتعطيك الملف المناسب. على ويندوز تفتح الملف وتنتظر حتى ينتهي. على ماك تفتح الملف وتسحب أيقونة Claude إلى مجلد التطبيقات (Applications)."},
    {h:"إذا ظهرت رسالة تحذير", p:"قد يسألك الجهاز «هل تريد السماح لهذا التطبيق بإجراء تغييرات؟» أو «هل أنت متأكد من فتحه؟». هذا طبيعي لأي برنامج جديد. اضغط «نعم» أو «فتح» ما دام الملف من موقع claude.ai."}],
   links:[{label:"صفحة تحميل Claude", url:"https://claude.ai/download", note:"اختر نسخة جهازك (ويندوز أو ماك)"}],
   apply:{steps:["اضغط زر «صفحة تحميل Claude» وحمّل الملف.","افتح الملف من التنزيلات وثبّته.","افتح التطبيق وسجّل دخولك بنفس حسابك."], success:"ترى شاشة المحادثة في تطبيق Claude على جهازك."}},
  {id:"2-2", title:"ثبّت برنامج Node.js", min:"6 دقائق", clip:"clips/2-2.mp4",
   why:"الاستوديو الذي يصنع الحركة (Remotion) لا يعمل بدون Node.js، مثل سيارة بدون محرّك.",
   explain:[
    {h:"ما هو Node.js؟", p:"برنامج صغير ومجاني يسمح للكمبيوتر بتشغيل أدوات مكتوبة بلغة JavaScript. أداة صناعة الحركة التي يستخدمها Claude من هذا النوع. لن تفتح Node.js بنفسك أبداً، ولن تراه بعد التثبيت. Claude هو من يستخدمه."},
    {h:"لماذا نسخة LTS بالذات؟", p:"في الموقع خياران عادة: LTS و Current. كلمة LTS تعني «دعم طويل الأمد»، أي النسخة المجرّبة والثابتة. النسخة الأخرى أحدث لكنها قد تحمل مشاكل. اختر LTS دائماً."},
    {h:"أثناء التثبيت", p:"ستظهر لك عدة شاشات فيها أزرار Next أو Continue. اترك كل الخيارات كما هي واضغط Next حتى تصل إلى Finish أو Close. لا تحتاج تغيير أي شيء. قد يطلب منك كلمة مرور الجهاز في النهاية."}],
   links:[{label:"موقع Node.js", url:"https://nodejs.org", note:"اضغط زر التحميل المكتوب عليه LTS"}],
   prompts:[{t:"تأكد من التثبيت", txt:"تأكد أن Node.js مثبّت عندي على هذا الجهاز وأخبرني برقم النسخة. وإن لم يكن مثبتاً، اشرح لي خطوة بخطوة كيف أثبّته."}],
   apply:{steps:["حمّل نسخة LTS من الزر بالأعلى وثبّتها.","في تطبيق Claude أرسل رسالة التأكد بالأعلى.","إذا طلب Claude إذناً لتشغيل أمر على جهازك، اضغط «سماح»."], success:"ردّ Claude بأن Node.js مثبّت وذكر رقم النسخة."}},
  {id:"2-3", title:"اختر مجلد فيديوهاتك", min:"4 دقائق", clip:"clips/2-3.mp4",
   why:"Claude لا يلمس أي ملف في جهازك إلا داخل المجلد الذي تختاره أنت. هذا يحميك ويُبقي فيديوهاتك في مكان واحد.",
   explain:[
    {h:"لماذا مجلد خاص؟", p:"صناعة الفيديو تنتج ملفات كثيرة: الصور، والصوت، والكود، والفيديو النهائي. إذا خصّصت مجلداً واحداً لها، ستجد كل شيء بسهولة، ولن تختلط بملفاتك الأخرى."},
    {h:"الإذن بيدك", p:"عندما تضيف المجلد في المحادثة، أنت تقول لـ Claude: «هذا المكان الوحيد الذي تعمل فيه». لا يستطيع الوصول لصورك أو مستنداتك الأخرى. يمكنك إزالة المجلد من المحادثة متى شئت."},
    {h:"نصيحة مهمة", p:"اجعل المجلد على سطح المكتب أو في «المستندات»، وليس داخل مجلد متزامن مع السحابة مثل OneDrive أو iCloud إن أمكن، لأن التزامن قد يبطئ العمل. وإن كان كذلك فلا بأس، Claude يتعامل معه ويخبرك."}],
   prompts:[{t:"تأكد أن Claude يرى المجلد", txt:"هل تستطيع أن ترى مجلد فيديوهاتي؟ أنشئ فيه ملفاً نصياً صغيراً باسم «تجربة» فيه جملة ترحيب، لأتأكد أن كل شيء يعمل."}],
   apply:{steps:["أنشئ مجلداً على سطح المكتب باسم «فيديوهاتي».",`في تطبيق Claude اضغط ${K("+")} بجانب مربع الكتابة، ثم ${K("Add folder")} واختر المجلد.`,"أرسل رسالة التأكد بالأعلى، ثم افتح المجلد وتأكد من وجود ملف «تجربة»."], success:"ظهر ملف «تجربة» داخل مجلد فيديوهاتي."}},
  {id:"2-4", title:"فعّل مهارة الموشن جرافيك", min:"4 دقائق", clip:"clips/2-4.mp4",
   why:"المهارة هي الفرق بين فيديو عادي وفيديو يبدو من استوديو محترف.",
   explain:[
    {h:"ما هي المهارة (Skill)؟", p:"المهارة ملف تعليمات مكتوب بعناية، مثل «وصفة طبخ» مفصّلة. عندما تطلب فيديو موشن، يقرأ Claude هذه الوصفة ويتبع خطواتها بالترتيب: يسألك الأسئلة المهمة، يكتب خطة المشاهد، يختار الحركة المناسبة، ويراجع الجودة قبل التسليم."},
    {h:"بدونها ماذا يحدث؟", p:"Claude يستطيع صناعة فيديو بدون المهارة، لكنه سيجتهد في كل مرة بطريقة مختلفة، وقد ينسى خطوة مهمة مثل سؤالك عن الموسيقى أو مراجعة النص العربي. المهارة تضمن نفس الجودة كل مرة."},
    {h:"كيف تحصل عليها؟", p:"تصلك طريقة تفعيل المهارة مع رسالة الترحيب في الدورة. بعد تفعيلها تظهر في صفحة Customize › Skills وبجانبها مفتاح تشغيل. تأكد أن المفتاح شغّال."}],
   links:[{label:"صفحة التخصيص في Claude", url:"https://claude.ai/customize", note:"ثم اختر تبويب Skills"}],
   prompts:[{t:"تأكد من المهارة", txt:"هل مهارة الموشن جرافيك (motion-graphics-remotion) مفعّلة عندك؟ إذا نعم، اشرح لي باختصار الخطوات التي ستتبعها عندما أطلب منك فيديو."}],
   apply:{steps:["فعّل المهارة كما في رسالة الترحيب.",`افتح ${P("Customize › Skills")} وتأكد أن مفتاحها شغّال.`,"أرسل رسالة التأكد بالأعلى."], success:"ردّ Claude بأن المهارة مفعّلة وشرح خطواتها."}}
 ]},
 {id:3, title:"اربط المواقع", sub:"أعطِ Claude الإذن باستخدام أدواتك", sections:[
  {id:"3-1", title:"اربط ElevenLabs", min:"5 دقائق", clip:"clips/3-1.mp4",
   why:"بدون هذا الربط لا يستطيع Claude صناعة التعليق الصوتي.",
   explain:[
    {h:"ما هو الموصل (Connector)؟", p:"الموصل جسر آمن بين Claude وموقع آخر. عندما تربط ElevenLabs، يصبح Claude قادراً على أن يطلب منه صناعة صوت باسمك، دون أن تعطيه كلمة مرورك. أنت تسجّل الدخول في صفحة ElevenLabs نفسها، ثم تضغط «موافقة»."},
    {h:"خطوتان مختلفتان: الربط ثم التفعيل", p:"الربط تفعله مرة واحدة في صفحة الموصلات. أما التفعيل فهو مفتاح داخل كل محادثة، تشغّله من زر + ثم Connectors. إذا نسيت التفعيل، سيقول لك Claude إنه لا يستطيع الوصول إلى ElevenLabs."},
    {h:"الرصيد والتكلفة", p:"كل تعليق صوتي يستهلك من رصيد حسابك في ElevenLabs حسب طول النص. فيديو مدته 30 ثانية يستهلك جزءاً بسيطاً، لكن راجع رصيدك قبل الفيديوهات الطويلة. Claude يصنع عادة نسختين من الصوت لتختار الأفضل."}],
   links:[
    {label:"صفحة موصل ElevenLabs", url:"https://claude.ai/directory/connectors/elevenlabs", note:"اضغط Connect ثم سجّل دخولك"},
    {label:"صفحة كل الموصلات", url:"https://claude.ai/customize/connectors", note:"للتأكد أن ElevenLabs صار مربوطاً"}],
   prompts:[{t:"جرّب أول صوت", txt:"باستخدام ElevenLabs، اصنع تعليقاً صوتياً قصيراً باللهجة السعودية بصوت رجل هادئ يقول: «هلا وغلا، هذا أول صوت أصنعه مع Claude». واعرض لي الأصوات المتاحة إن احتجت أن أختار."}],
   apply:{steps:["اربط ElevenLabs من الزر الأول.",`في محادثة جديدة اضغط ${K("+")} ثم ${K("Connectors")} وشغّل ElevenLabs.`,"أرسل رسالة التجربة بالأعلى واستمع للصوت."], success:"سمعت أول تعليق صوتي صنعه Claude لك."}},
  {id:"3-2", title:"الموسيقى والمؤثرات (اختياري)", min:"5 دقائق", clip:"clips/3-2.mp4",
   why:"إذا أردت أن يصنع Claude موسيقى ومؤثرات صوتية خاصة بفيديوك، تحتاج هذا الموصل الإضافي.",
   explain:[
    {h:"لماذا موصل ثانٍ؟", p:"موصل ElevenLabs العادي يصنع الكلام فقط. الموصل المخصّص (Custom) يفتح كل خدمات ElevenLabs، ومنها توليد الموسيقى والمؤثرات. هذه الخطوة اختيارية، فـ Claude يستطيع أيضاً استخدام موسيقى مجانية جاهزة."},
    {h:"كيف تضيفه؟", p:`اذهب إلى ${P("Customize › Connectors")} واضغط ${K("Add")}، ثم مرّر الماوس على ${K("Custom")} واختر ${K("Web")}. اكتب الاسم ElevenLabs، والصق الرابط بالأسفل، ثم ${K("Continue")}، واختر تسجيل الدخول، ثم ${K("Add")}.`},
    {h:"تنبيه للخطة المجانية", p:"الخطة المجانية في Claude تسمح بموصل مخصّص واحد فقط. إذا كنت تستخدمه لشيء آخر، تخطّ هذه الخطوة ولا مشكلة."}],
   links:[{label:"صفحة الموصلات", url:"https://claude.ai/customize/connectors", note:"ثم Add › Custom › Web"}],
   prompts:[
    {t:"رابط الموصل المخصّص (انسخه والصقه)", txt:"https://api.elevenlabs.io/v1/mcp", ltr:true},
    {t:"جرّب الموسيقى", txt:"باستخدام ElevenLabs اصنع لي مقطع موسيقى هادئة بدون غناء مدته 20 ثانية، تناسب فيديو تعليمي."}],
   apply:{steps:["أضف الموصل المخصّص بالرابط بالأعلى.","فعّله في المحادثة من زر + ثم Connectors.","أرسل رسالة تجربة الموسيقى."], success:"سمعت مقطع موسيقى صنعه Claude. (أو قرّرت تخطّي هذه الخطوة)"}},
  {id:"3-3", title:"تعرّف على whatships و 21st.dev", min:"6 دقائق", clip:"clips/3-3.mp4", voiced:true,
   why:"هذان الموقعان هما سرّ الشكل الاحترافي. معرفتهما تجعلك تختار الأسلوب بثقة.",
   explain:[
    {h:"whatships.com: معرض الأساليب", p:"موقع فيه فيديوهات إطلاق منتجات صنعتها شركات واستوديوهات محترفة. عندما يسألك Claude «هل تختار مرجع الأسلوب بنفسك؟»، تستطيع أن تتصفح الموقع، تختار فيديو يعجبك شكله وحركته، وترسل رابطه. Claude لا ينسخ المحتوى، بل يتعلّم «لغة الحركة»: سرعتها، ألوانها، طريقة ظهور النصوص."},
    {h:"21st.dev: قطع جاهزة", p:"مكتبة أزرار وبطاقات وشاشات صمّمها مصمّمون محترفون. عندما يحتاج فيديوك شاشة تطبيق أو بطاقة أو قائمة، يأخذ Claude القطعة المناسبة من هنا ويعدّل ألوانها لتناسب فيديوك. لا تحتاج أن تفتح الموقع بنفسك."},
    {h:"ماذا لو لم أعرف ماذا أختار؟", p:"قل لـ Claude «اختر لي». سيتصفح المعرض بنفسه، ويختار مرجعاً يناسب موضوعك ومشاعره، ويخبرك ماذا اختار ولماذا. تستطيع دائماً أن تقول «غيّره»."}],
   links:[
    {label:"تصفّح whatships", url:"https://whatships.com", note:"شاهد بعض الفيديوهات واختر واحداً يعجبك"},
    {label:"تصفّح 21st.dev", url:"https://21st.dev", note:"للاطلاع فقط"}],
   prompts:[{t:"اطلب رأي Claude في مرجع", txt:"هذا رابط فيديو أعجبني من whatships: [الصق الرابط هنا]. صف لي بكلمات بسيطة ما الذي يميّز أسلوبه (الألوان، الحركة، النصوص)، وهل يناسب فيديو عن [موضوعي]؟"}],
   apply:{steps:["افتح whatships وشاهد ثلاثة فيديوهات على الأقل.","انسخ رابط الفيديو الذي أعجبك.","أرسل الرسالة الجاهزة بعد وضع الرابط وموضوعك مكان الأقواس."], success:"وصفَ لك Claude أسلوب الفيديو الذي اخترته."}}
 ]},
 {id:4, title:"فيديوك الأول", sub:"من الفكرة إلى ملف MP4", sections:[
  {id:"4-1", title:"اكتب فكرتك", min:"8 دقائق", clip:"clips/4-1.mp4", voiced:true,
   why:"الرسالة الأولى هي الأساس. كلما كانت أوضح، قلّت التعديلات لاحقاً.",
   explain:[
    {h:"خمسة أشياء تجعل فكرتك واضحة", p:"1) الموضوع: عن ماذا الفيديو؟ 2) الجمهور: من سيشاهده؟ (عائلتك، عملاؤك، طلاب). 3) المقاس: طولي للجوال (انستغرام، تيك توك، واتساب) أو عرضي لليوتيوب والعرض على الشاشة. 4) المدة: 30 ثانية مناسبة للبداية. 5) الصوت: بدون صوت، أو صوتك أنت، أو صوت من ElevenLabs."},
    {h:"اكتب الرسالة كما تتكلم", p:"لا تحتاج لغة رسمية. «أبي فيديو يعرّف بمحلي للعسل في جازان، للعوائل، طولي للانستقرام» رسالة ممتازة. إذا نسيت شيئاً، سيسألك Claude عنه."},
    {h:"أضف التفاصيل التي تهمّك", p:"إذا كان عندك اسم مشروع، أو شعار، أو ألوان معيّنة، أو جملة تريدها في النهاية (مثل رقم التواصل)، اذكرها من البداية. وإذا كان المشروع معروفاً وله موقع، سيبحث Claude عن شعاره الرسمي بنفسه."}],
   prompts:[
    {t:"الرسالة الجاهزة (عدّل ما بين القوسين)", txt:"أريد فيديو موشن جرافيك عن [موضوعي]، موجّه إلى [الجمهور]، مقاس [طولي / عرضي] ومدته [30 ثانية]، بتعليق صوتي عربي من ElevenLabs بصوت [رجل / امرأة] ونبرة [هادئة / حماسية]."},

/* ============ ACTIVATION ============
   LIVE build: codes are checked by the Supabase Edge Function "course-access"
   (one code = one buyer name, up to 2 devices). Clips come back as private
   links that expire after 6 hours, so they are not public files.
   PREVIEW build (the Claude artifact): demo code + local clips, because the
   artifact cannot call outside servers. */
const LIVE = true;
const API = "https://eilocqqsjpxgnfzuxtny.supabase.co/functions/v1/course-access";
const DEMO_CODE = "DEMO-2026";
let CLIPS = {};
const REASONS = {
  bad_format: "شكل الكود غير صحيح. اكتبه كما وصلك من المتجر، مثل: ABCD-2345",
  not_found: "لم نجد هذا الكود. تأكد من كتابته كما وصلك في رسالة الطلب.",
  revoked: "هذا الكود موقوف. تواصل معنا من صفحة طلبك في المتجر.",
  device_limit: "هذا الكود مفعّل على جهازين بالفعل. تواصل معنا لننقله إلى جهازك الجديد.",
  rate_limited: "محاولات كثيرة. انتظر نصف ساعة ثم حاول مرة أخرى.",
  name_required: "اكتب اسمك أولاً، سيظهر في شهادتك.",
  server: "حدث خطأ عندنا. حاول بعد قليل.",
  network: "تعذّر الاتصال. تأكد من الإنترنت وحاول مرة أخرى."
};
function deviceId(){
  try {
    let d = localStorage.getItem("mc-device");
    if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); localStorage.setItem("mc-device", d); }
    return d;
  } catch(e) { return "nostore-" + navigator.userAgent.length + "-" + screen.width; }
}
async function verifyCode(code, name){
  code = code.replace(/\s+/g, "").toUpperCase();
  if (/^[A-Z0-9]{8}$/.test(code)) code = code.slice(0,4) + "-" + code.slice(4);
  if (!LIVE) {
    await new Promise(r => setTimeout(r, 400));
    if (code === DEMO_CODE) return {ok:true, name, code};
    return {ok:false, msg: /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code) ? REASONS.not_found : REASONS.bad_format};
  }
  try {
    const res = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code, name, device: deviceId()})});
    const r = await res.json();
    if (!r.ok) return {ok:false, reason:r.reason, msg: REASONS[r.reason] || REASONS.server};
    CLIPS = r.clips || {};
    return {ok:true, name: r.name || name, code};
  } catch(e) { return {ok:false, reason:"network", msg: REASONS.network}; }
}
const clipSrc = x => LIVE ? CLIPS[x.id] : x.clip;

    ${err ? `<div class="msg err" role="alert">${esc(err)}</div>` : ""}
    <button class="btn" id="actBtn" type="submit">ابدأ الرحلة</button>
    ${LIVE ? `<p class="demo">الكود يُفعَّل باسمك، ويعمل على جهازين كحد أقصى (مثلاً الكمبيوتر والجوال).</p>` : `<div class="demo">نسخة تجريبية: للتجربة اكتب الكود <b>${DEMO_CODE}</b></div>`}
  </form>
  <div class="how">
    <div><b>1. اشترِ الدورة</b>من متجرنا في سلة</div>
    <div><b>2. يصلك الكود</b>مع رابط الموقع بعد الدفع</div>
    <div><b>3. فعّل وابدأ</b>اكتب اسمك والكود هنا</div>
  </div></div>`;
  document.getElementById("actForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("nm").value.trim();
    const code = document.getElementById("cd").value.trim().toUpperCase();
    if (!name) return viewActivate("اكتب اسمك أولاً، سيظهر في شهادتك.");
    if (!code) return viewActivate("اكتب كود التفعيل الذي وصلك بعد الشراء.");
    const b = document.getElementById("actBtn"); b.disabled = true; b.textContent = "جارٍ التحقق…";
    const r = await verifyCode(code, name);
    if (!r.ok) { S.name = name; return viewActivate(r.msg); }
    S.name = r.name; S.code = r.code; S.active = true; save(); viewMap();
    toast(r.name !== name ? `مرحباً ${r.name}، الكود مفعّل باسمك من قبل` : "تم تفعيل دورتك. بالتوفيق!");
  });
}

function viewMap(){
  const cur = firstOpen();
  const allDone = !cur;
  app.innerHTML = bar() + `<div class="wrap">
  <section class="hello">
    <h1>${allDone ? "أنهيت الرحلة كاملة 🎉" : "تابع رحلتك"}</h1>
    <p>${allDone ? "شهادتك جاهزة في آخر الصفحة." : `القسم التالي: <b>${cur.title}</b>`}</p>
  </section>
  ${STAGES.map(st => {
    const doneN = st.sections.filter(x => isDone(x.id)).length;
    const locked = !unlocked(st.sections[0].id);
    const full = doneN === st.sections.length;
    return `<section class="stage ${locked ? "locked" : ""}">
      <div class="stage-head"><div class="lvl">${st.id}</div><div><h2>المرحلة ${st.id} · ${st.title}</h2><p>${st.sub}</p></div>
      <span class="badge ${full ? "" : "dim"}">${full ? "مكتملة ★" : `${doneN} من ${st.sections.length}`}</span></div>
      <div class="path">${st.sections.map(x => {
        const d = isDone(x.id), u = unlocked(x.id), c = cur && cur.id === x.id;
        const cls = d ? "done" : u ? (c ? "current" : "") : "locked";
        const inner = d ? ICON.star : u ? x.id.split("-")[1] : ICON.lock;
        return `<button class="node ${cls}" data-sec="${x.id}" ${u ? "" : 'aria-disabled="true"'}>
          <span class="dot">${inner}</span>
          <span class="lbl"><b>${x.title}</b><small>${d ? "أُنجز" : u ? x.min : "مقفل حتى تنهي ما قبله"}</small></span></button>`;
      }).join("")}</div></section>`;
  }).join("")}
  ${allDone ? certificate() : ""}
  <div class="foot"><span>تقدّمك محفوظ على هذا الجهاز.</span><button class="linkbtn" id="reset">البدء من جديد</button></div>
  </div>`;
  app.querySelectorAll(".node").forEach(n => n.addEventListener("click", () => {
    const id = n.dataset.sec;
    if (!unlocked(id)) return toast("أنهِ القسم السابق أولاً ليُفتح هذا القسم");
    viewLesson(id);
  }));
  wireBar();
  const r = document.getElementById("reset");
  r.addEventListener("click", () => {
    if (r.dataset.armed) { S.done = {}; save(); viewMap(); toast("بدأت من جديد"); }
    else { r.dataset.armed = "1"; r.textContent = "اضغط مرة أخرى للتأكيد: سيُمسح تقدّمك"; }
  });
  if (cur) { const el = app.querySelector(`[data-sec="${cur.id}"]`); if (el && starCount()) el.scrollIntoView({block:"center"}); }
}

function certificate(){
  const d = new Date().toLocaleDateString("ar-SA-u-ca-gregory", {year:"numeric", month:"long", day:"numeric"});
  return `<section class="cert" style="margin-top:2rem">
    <div class="medal">${ICON.trophy.replace('<svg','<svg width="44" height="44"')}</div>
    <h2>شهادة إتمام دورة</h2>
    <div class="nm">${esc(S.name)}</div>
    <p>أتمّ المراحل الخمس في دورة «اصنع فيديو موشن جرافيك مع Claude»</p>
    <p style="font-size:.85rem">${d}</p>
  </section>`;
}

function viewLesson(id){
  const x = ALL.find(s => s.id === id);
  const st = x.stage;
  const idx = st.sections.indexOf(st.sections.find(s => s.id === id));
  const src = clipSrc(x);
  const clip = src ? `<video controls playsinline preload="metadata" src="${esc(src)}" aria-label="مقطع شرح ${esc(x.title)}"></video>`
    : `<div class="ph"><div class="play">${ICON.play}</div><b>مقطع الشرح</b><small>${LIVE ? "تعذّر تحميل المقطع. حدّث الصفحة وحاول مرة أخرى." : "يُضاف قريباً"}</small></div>`;
  const prompts = x.prompts || [], links = x.links || [];
  app.innerHTML = bar() + `<div class="wrap"><article class="lesson">
    <button class="btn ghost back" id="back">→ الخريطة</button>
    <div class="crumb">المرحلة ${st.id} · ${st.title} · القسم ${idx+1} من ${st.sections.length}</div>
    <div class="steps-row">${st.sections.map((s,i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div>
    <h1>${x.title}</h1>
    <div class="why"><b>لماذا هذا مهم؟</b><p>${x.why}</p></div>
    <div class="clip">${clip}</div>
    <p class="cliptag">${src ? (x.voiced ? "مقطع مشروح بالصوت، مع ترجمة مكتوبة." : "مقطع خطوات بموسيقى هادئة: أوقفه عند أي خطوة وطبّقها.") : ""}</p>
    <section class="explain"><h2>الشرح</h2>
      ${x.explain.map(e => `<div class="ex"><h3>${e.h}</h3><p>${e.p}</p></div>`).join("")}
    </section>
    ${x.tools ? `<div class="tools">${TOOLS.map(t => `<div><b class="en" style="text-align:right">${t[0]}</b><small>${t[1]}</small><span class="tag ${t[2]}">${t[3]}</span></div>`).join("")}</div>` : ""}
    ${x.table ? `<div class="tbl"><table><tr><th>ما تريده</th><th>ماذا تكتب</th></tr>${x.table.map(r => `<tr><td>${r[0]}</td><td class="say">«${r[1]}»</td></tr>`).join("")}</table></div>` : ""}
    <section class="apply" aria-labelledby="applyH">
      <div class="apply-head"><span class="apply-ic">${ICON.play}</span><h2 id="applyH">طبّق الآن في Claude</h2></div>
      <p class="apply-sub">افتح Claude بجانب هذه الصفحة. ستجد هنا الروابط والرسائل الجاهزة، ثم الخطوات بالترتيب.</p>
      ${links.length ? `<div class="links">${links.map(l => `<a class="linkcard" href="${l.url}" target="_blank" rel="noopener"><span class="lk-t">${l.label} ↗</span><span class="lk-u">${esc(l.url.replace(/^https?:\/\//,""))}</span>${l.note ? `<span class="lk-n">${l.note}</span>` : ""}</a>`).join("")}</div>` : ""}
      ${prompts.map((c,i) => `<div class="copybox"><div class="t">${c.t}</div><div class="txt ${c.ltr ? "ltr" : ""}" id="cp${i}">${esc(c.txt)}</div><button class="btn gold cpBtn" data-i="${i}">نسخ</button></div>`).join("")}
      <h3 class="apply-h3">الخطوات</h3>
      <ol class="apply-steps">${x.apply.steps.map((t,i) => `<li><span class="n">${i+1}</span><p>${t}</p></li>`).join("")}</ol>
      <div class="success"><b>كيف تعرف أنك نجحت؟</b><p>${x.apply.success}</p></div>
      <div id="doneRow"></div>
    </section>
    <div class="next-row" id="nextRow"></div>
  </article></div>`;
  window.scrollTo(0,0);
  wireBar();
  document.getElementById("back").addEventListener("click", viewMap);
  app.querySelectorAll(".cpBtn").forEach(cp => cp.addEventListener("click", () => {
    const i = +cp.dataset.i, t = prompts[i].txt, el = document.getElementById("cp"+i);
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("حدّدت النص، انسخه من القائمة"); };
    try { navigator.clipboard.writeText(t).then(() => { cp.textContent = "تم النسخ ✓"; toast("تم النسخ، الصقه في Claude"); setTimeout(() => cp.textContent = "نسخ", 2500); }, sel); } catch(e) { sel(); }
  }));
  const doneRow = document.getElementById("doneRow");
  const renderDone = () => {
    if (isDone(id)) { doneRow.innerHTML = `<div class="donebadge">${ICON.star.replace('<svg','<svg width="22" height="22"')} طبّقت هذا القسم</div>`; return; }
    doneRow.innerHTML = `<button class="btn big" id="markDone">${x.final ? "أنجزت مشروعي، أعطني الشهادة" : "طبّقتها ✓ افتح القسم التالي"}</button>`;
    document.getElementById("markDone").addEventListener("click", () => {
      S.done[id] = Date.now(); save();
      toast(x.final ? "مبروك! حصلت على شهادتك" : "+1 نجمة ★");
      renderDone(); showNext(x, false);
      document.querySelector(".stars").innerHTML = `${ICON.star.replace('<svg','<svg width="18" height="18"')} ${starCount()} من ${ALL.length}`;
      document.querySelector(".prog i").style.width = Math.round(starCount()/ALL.length*100) + "%";
      document.getElementById("nextRow").scrollIntoView({block:"center", behavior:"smooth"});
    });
  };
  renderDone();
  if (isDone(id)) showNext(x, true);
}

function showNext(x, already){
  const i = ALL.findIndex(s => s.id === x.id);
  const nx = ALL[i+1];
  const row = document.getElementById("nextRow");
  const stageEnd = !nx || nx.stage.id !== x.stage.id;
  if (!already && stageEnd && x.stage.sections.every(s => isDone(s.id))) toast(nx ? `أنهيت المرحلة ${x.stage.id}! فُتحت المرحلة ${nx.stage.id}` : "أنهيت الرحلة كاملة!");
  row.innerHTML = nx
    ? `<button class="btn" id="goNext">${stageEnd ? `إلى المرحلة ${nx.stage.id} ←` : "القسم التالي ←"}</button><button class="btn ghost" id="goMap">الخريطة</button>`
    : `<button class="btn gold" id="goMap">عرض شهادتي</button>`;
  const g = document.getElementById("goNext"); if (g) g.addEventListener("click", () => viewLesson(nx.id));
  document.getElementById("goMap").addEventListener("click", () => { viewMap(); if (!nx) setTimeout(() => { const c = document.querySelector(".cert"); c && c.scrollIntoView({block:"center"}); }, 50); });
}

function wireBar(){
  app.querySelectorAll(".sizes button").forEach(b => b.addEventListener("click", () => {
    S.size = b.dataset.size; save(); applySize();
    app.querySelectorAll(".sizes button").forEach(o => o.setAttribute("aria-pressed", o === b));
  }));
}

async function boot(){
  if (!S.active) return viewActivate();
  if (!LIVE) return viewMap();
  app.innerHTML = `<div class="wrap"><section class="hero"><p>جارٍ فتح دورتك…</p></section></div>`;
  const r = await verifyCode(S.code || "", S.name);
  if (r.ok) { S.name = r.name; save(); return viewMap(); }
  if (r.reason === "network" || r.reason === "server" || r.reason === "rate_limited") { viewMap(); return toast(r.msg); }
  S.active = false; save(); viewActivate(r.msg);
}
boot();
</script>
